server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lingxi-companion
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lingxi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  modulith:
    runtime:
      verification-enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.lingxi: INFO

lingxi:
  identity:
    assertion-secret: ${IDENTITY_ASSERTION_SECRET}
    privacy-export-key: ${PRIVACY_EXPORT_KEY}
    bootstrap-admin:
      username: ${LINGXI_ADMIN_USERNAME:}
      password: ${LINGXI_ADMIN_PASSWORD:}
      display-name: ${LINGXI_ADMIN_DISPLAY_NAME:平台管理员}
