server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lingxi-companion
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lingxi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    baseline-on-migrate: true
    baseline-version: "1.0.0.082"
  modulith:
    runtime:
      verification-enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.lingxi: INFO

lingxi:
  identity:
    assertion-secret: ${IDENTITY_ASSERTION_SECRET}
    privacy-export-key: ${PRIVACY_EXPORT_KEY}
    # 手机号登录（过渡入口）：不校验短信验证码，任何知道手机号的人都能登录该账号。
    # 对外开放前必须接入短信验证码或受信身份桥接层；需要立即关闭时设为 false。
    phone-login-enabled: ${LINGXI_PHONE_LOGIN_ENABLED:true}
    bootstrap-admin:
      username: ${LINGXI_ADMIN_USERNAME:}
      password: ${LINGXI_ADMIN_PASSWORD:}
      display-name: ${LINGXI_ADMIN_DISPLAY_NAME:平台管理员}
  goal:
    achievement:
      # 连续打卡成就阈值天数，产品确认具体数值前使用可配置默认值
      check-in-streak-days: ${LINGXI_GOAL_ACHIEVEMENT_STREAK_DAYS:7}
