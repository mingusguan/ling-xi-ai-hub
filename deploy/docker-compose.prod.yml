services:
  lingxi-admin:
    image: ${IMAGE_REPOSITORY}:${IMAGE_TAG}
    container_name: lingxi-admin
    restart: unless-stopped
    networks:
      - shared
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:-"-Xms256m -Xmx768m -XX:+UseG1GC"}
      SERVER_PORT: 8080

      DB_URL: ${MYSQL_URL}
      DB_USERNAME: ${MYSQL_USERNAME}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE:-0}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      IDENTITY_ASSERTION_SECRET: ${IDENTITY_ASSERTION_SECRET:-}
      PRIVACY_EXPORT_KEY: ${PRIVACY_EXPORT_KEY:-}
      LINGXI_ADMIN_USERNAME: ${LINGXI_ADMIN_USERNAME:-}
      LINGXI_ADMIN_PASSWORD: ${LINGXI_ADMIN_PASSWORD:-}
      LINGXI_ADMIN_DISPLAY_NAME: ${LINGXI_ADMIN_DISPLAY_NAME:-平台管理员}
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  shared:
    name: ${SHARED_NETWORK:-mingus-net}
    external: true
