# ============================================================================
#  lingxi.mingusone.com —— 管理后台 HTTPS 正式入口
#
#  背景：管理端此前只有 80 端口，443 上没有对应 server_name，于是 SNI 落到
#  family.mingusone.com 的 vhost，浏览器拿到的证书域名不匹配；实测真实 TLS 校验
#  直接失败（curl 不加 -k 返回 000）。管理员登录会把口令发出去，明文 HTTP 是必须
#  先解决的问题。
#
#  这里同时接管 80 与 443：
#   - 80 只保留 certbot webroot 校验，其余全部 308 跳 HTTPS；
#   - 443 承载静态后台与 /prod-api/、/profile/ 反代。
#
#  注意：本文件的 80 块是 default.conf 里同名 server_name 的替代，因此部署时必须
#  同时移除 default.conf 中的 80 块，否则 nginx 会报 conflicting server name。
# ============================================================================

server {
    listen 80;
    server_name lingxi.mingusone.com;

    # 续期校验必须能通过：先用 ^~ 前缀匹配截住，再交给 308 跳转。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lingxi.mingusone.com;

    ssl_certificate /etc/letsencrypt/live/lingxi.mingusone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingxi.mingusone.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 静态根目录必须显式声明：漏掉时 try_files 会退回默认 root 并触发
    # "rewrite or internal redirection cycle"（用户端 vhost 已踩过这个坑）。
    root /usr/share/nginx/html/lingxi/dist;
    index index.html;

    client_max_body_size 100m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /prod-api/ {
        proxy_pass http://lingxi-admin:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /profile/ {
        proxy_pass http://lingxi-admin:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
