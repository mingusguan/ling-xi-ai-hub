# ============================================================================
#  灵犀伴行 PC 用户端（lingxi-web / apps/user-web）— HTTP 入口（证书就绪前）
#  ---------------------------------------------------------------------------
#  入口：http://app.mingusone.com
#  产物：/data/mingus/nginx/html/lingxi-app/dist（由 CI .github/workflows/deploy-lingxi-user-web.yml 发布）
#  后端：lingxi-admin:8080（模块化单体）
#
#  与后台管理端（lingxi.mingusone.com）的关键差异：
#  1. 用户端前端调用同源相对路径 /api/v1/**（见 lingxi-web 的 baseUrl: ''），
#     因此这里必须把 /api/ 原路径直接转发到后端；proxy_pass 结尾不带 / 才能保留路径。
#  2. R04 Companion Agent 使用 SSE 事件流，代理必须关闭缓冲并放宽读超时，
#     否则事件会被 nginx 攒着不发、长连接被提前掐断。
#
#  ⚠️ 生命周期：本文件只在「证书尚未签发」阶段生效。`enable-https.sh` 签发证书后会
#  启用 lingxi-app-https.conf（80 做 308 跳转 + 443 提供站点），并**删除本文件**——
#  因为两个文件都声明 `listen 80; server_name app.mingusone.com;` 时，nginx 会报
#  `conflicting server name ... ignored` 并且只采用先加载的那个 server 块（实测遇到）。
#  需要重新引导时，把本文件再放回 conf.d 即可。
# ============================================================================

server {
    listen 80;
    server_name app.mingusone.com;

    # 静态资源根目录必须显式指向本 vhost 自己的 dist。
    # 漏掉这一行时 nginx 会退回默认 root（/usr/share/nginx/html），
    # try_files 找不到文件后回落到 /index.html，触发
    # "rewrite or internal redirection cycle" 并返回 500（已实测踩到）。
    root /usr/share/nginx/html/lingxi-app/dist;
    index index.html;

    # certbot webroot 校验（DNS 生效、证书签发前即可用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # 证书就绪前先提供 HTTP 访问；签发 HTTPS 后由 lingxi-app-https.conf 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://lingxi-admin:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location /actuator/ {
        proxy_pass http://lingxi-admin:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /profile/ {
        proxy_pass http://lingxi-admin:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
